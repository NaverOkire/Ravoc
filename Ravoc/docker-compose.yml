version: "3.9"
services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ravoc-chroma
    ports:
      - "8000:8000"
    volumes:
      - D:/ravoc/chroma_data:/chroma/chroma
    environment:
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=false
    restart: unless-stopped